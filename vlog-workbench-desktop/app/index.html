<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlog Creator Workbench | Vlog 创作工作台</title>
<style>
:root {
  --bg-primary: #0a1929;
  --bg-secondary: #102a43;
  --bg-card: #1a3a5c;
  --bg-hover: #243b53;
  --bg-input: #0d1f30;
  --accent: #00d4ff;
  --accent-dim: #0284c7;
  --accent-glow: rgba(0, 212, 255, 0.15);
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #f87171;
  --purple: #a78bfa;
  --pink: #f472b6;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #1e3a5f;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.08);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.app-shell { display: flex; height: 100vh; position: relative; z-index: 1; }

/* ========== Workspace Switcher (far left) ========== */
.workspace-bar {
  width: 64px;
  background: #06131f;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 8px;
  flex-shrink: 0;
  z-index: 50;
}

.ws-btn {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--bg-card);
  cursor: pointer;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  position: relative;
}

.ws-btn:hover { background: var(--bg-hover); transform: scale(1.05); }

.ws-btn.active {
  border-color: var(--accent);
  background: var(--accent-glow);
  box-shadow: 0 0 12px var(--accent-glow);
}

.ws-btn .ws-label {
  position: absolute;
  left: 56px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 200;
}

.ws-btn:hover .ws-label { opacity: 1; }

.ws-divider { width: 32px; height: 1px; background: var(--border); margin: 4px 0; }

.ws-add {
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 20px;
  transition: all var(--transition);
}

.ws-add:hover { border-color: var(--accent); color: var(--accent); }

/* ========== Sidebar ========== */
.sidebar {
  width: 220px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.3s;
}

.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-header .ws-name {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 600;
}

.sidebar-header .ws-name-en {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.nav-list { list-style: none; padding: 10px; flex: 1; overflow-y: auto; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all var(--transition);
  margin-bottom: 3px;
  font-size: 13px;
  position: relative;
}

.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }

.nav-item.active {
  background: var(--accent-glow);
  color: var(--accent);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 60%;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}

.nav-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-label-en { font-size: 9px; color: var(--text-muted); margin-left: auto; text-transform: uppercase; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}

.sb-btn {
  flex: 1;
  padding: 7px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 11px;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.sb-btn:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent-dim); }

/* ========== Main ========== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.content-header {
  padding: 20px 32px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  flex-shrink: 0;
}

.content-header h2 { font-size: 22px; font-weight: 700; }
.content-header .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.content-body { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ========== Buttons ========== */
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #001220; }
.btn-primary:hover { box-shadow: 0 0 16px var(--accent-glow); transform: translateY(-1px); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--accent-dim); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
.btn-danger:hover { background: rgba(248,113,113,0.1); }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* ========== Dashboard ========== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
}

.stat-card:hover { border-color: var(--accent-dim); box-shadow: var(--shadow-glow); transform: translateY(-2px); }

.stat-card::after {
  content: '';
  position: absolute;
  top: -16px; right: -16px;
  width: 64px; height: 64px;
  border-radius: 50%;
  opacity: 0.05;
}

.stat-card[data-color="accent"]::after { background: var(--accent); }
.stat-card[data-color="success"]::after { background: var(--success); }
.stat-card[data-color="warning"]::after { background: var(--warning); }
.stat-card[data-color="purple"]::after { background: var(--purple); }

.stat-icon { font-size: 24px; margin-bottom: 8px; }
.stat-value { font-size: 30px; font-weight: 800; line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.stat-label-en { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

.dash-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-title .en { font-size: 10px; color: var(--text-muted); font-weight: 400; text-transform: uppercase; }

.activity-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.quick-action {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 6px;
}

.quick-action:hover { border-color: var(--accent-dim); background: var(--bg-hover); }
.quick-action-icon { font-size: 18px; }
.quick-action-text { flex: 1; }
.quick-action-title { font-size: 12px; font-weight: 600; }
.quick-action-desc { font-size: 10px; color: var(--text-muted); }

/* ========== Kanban ========== */
.kanban-board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; min-height: 400px; }

.kanban-column {
  min-width: 250px;
  flex-shrink: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
}

.kanban-column-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.kanban-column-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.kanban-column-title .en { font-size: 9px; color: var(--text-muted); font-weight: 400; }

.column-badge {
  background: var(--bg-card);
  color: var(--text-secondary);
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.kanban-column-body { padding: 10px; flex: 1; overflow-y: auto; min-height: 80px; }
.kanban-column-body.drag-over { background: var(--accent-glow); }

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: all var(--transition);
}

.project-card:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }
.project-card.dragging { opacity: 0.5; cursor: grabbing; }

.project-card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.project-card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

.tag { font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.tag-port { background: rgba(0, 212, 255, 0.15); color: var(--accent); }
.tag-date { background: rgba(148, 163, 184, 0.15); color: var(--text-secondary); }

.progress-bar { width: 100%; height: 3px; background: var(--bg-input); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

.card-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity 0.2s; }
.project-card:hover .card-actions { opacity: 1; }

.empty-column { text-align: center; color: var(--text-muted); font-size: 11px; padding: 30px 0; }

/* ========== Table ========== */
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

.search-box { flex: 1; min-width: 180px; position: relative; }

.search-box input {
  width: 100%;
  padding: 8px 14px 8px 34px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
}

.search-box input:focus { outline: none; border-color: var(--accent); }

.search-box::before {
  content: '🔍';
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
}

.filter-select {
  padding: 8px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
}

.filter-select option { background: var(--bg-secondary); }

.table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }

.data-table { width: 100%; border-collapse: collapse; }

.data-table th {
  text-align: left;
  padding: 10px 14px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.data-table th .en { display: block; font-size: 9px; color: var(--text-muted); font-weight: 400; }

.data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.data-table tr:hover td { background: var(--bg-hover); }

.status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.status-raw { background: rgba(248,113,113,0.15); color: var(--danger); }
.status-sorted { background: rgba(251,191,36,0.15); color: var(--warning); }
.status-archived { background: rgba(74,222,128,0.15); color: var(--success); }

.type-icon { font-size: 14px; }

.row-actions { display: flex; gap: 4px; }

.icon-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-btn:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent-dim); }
.icon-btn.delete:hover { color: var(--danger); border-color: var(--danger); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }

/* ========== Calendar ========== */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.calendar-header { background: var(--bg-secondary); padding: 8px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-secondary); }

.calendar-cell { background: var(--bg-card); min-height: 80px; padding: 6px; font-size: 11px; position: relative; transition: background var(--transition); }
.calendar-cell:hover { background: var(--bg-hover); }
.calendar-cell.empty { background: var(--bg-secondary); opacity: 0.5; }
.calendar-cell.today { background: var(--accent-glow); }
.calendar-day { font-weight: 700; margin-bottom: 3px; }

.calendar-event {
  background: var(--accent-dim);
  color: #fff;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 9px;
  margin-bottom: 2px;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calendar-event.published { background: var(--success); color: #001220; }
.calendar-event.planned { background: var(--warning); color: #001220; }
.calendar-event.shoot { background: var(--purple); }

/* ========== Port Archive ========== */
.port-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

.port-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: all var(--transition);
  cursor: pointer;
}

.port-card:hover { border-color: var(--accent-dim); box-shadow: var(--shadow-glow); transform: translateY(-2px); }

.port-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.port-name { font-size: 16px; font-weight: 700; }
.port-country { font-size: 11px; color: var(--text-muted); }
.port-info { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
.port-info strong { color: var(--text-primary); font-weight: 600; }

.port-stats { display: flex; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.port-stat { text-align: center; flex: 1; }
.port-stat-value { font-size: 18px; font-weight: 700; color: var(--accent); }
.port-stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }

/* ========== Notes ========== */
.note-input { display: flex; gap: 8px; margin-bottom: 16px; }

.note-input input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
}

.note-input input:focus { outline: none; border-color: var(--accent); }

.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

.note-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 14px;
  transition: all var(--transition);
}

.note-card:hover { border-color: var(--accent-dim); box-shadow: var(--shadow); }

.note-text { font-size: 13px; line-height: 1.5; margin-bottom: 8px; word-break: break-word; }

.note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-muted); }

.note-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; }
.note-delete:hover { color: var(--danger); }

/* ========== Strategy Page (Black Mountain) ========== */
.strategy-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}

.strategy-section h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.strategy-section h3 .en { font-size: 11px; color: var(--text-muted); font-weight: 400; }

.strategy-list { list-style: none; }

.strategy-list li {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}

.strategy-list li:last-child { border-bottom: none; }
.strategy-list li strong { color: var(--text-primary); }

.topic-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  transition: all var(--transition);
}

.topic-card:hover { border-color: var(--accent-dim); }

.topic-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

.topic-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: #001220;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.topic-title { font-size: 13px; font-weight: 600; }

.topic-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }

.topic-meta { display: flex; gap: 8px; flex-wrap: wrap; }

.gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

.gear-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
}

.gear-icon { font-size: 24px; margin-bottom: 6px; }
.gear-name { font-size: 12px; font-weight: 600; }
.gear-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: modalIn 0.3s ease;
}

@keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-title .en { font-size: 11px; color: var(--text-muted); font-weight: 400; display: block; }
.modal-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; width: 30px; height: 30px; border-radius: 6px; transition: all var(--transition); display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body { padding: 22px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
.form-group label .en { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--bg-card);
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 13px;
  box-shadow: var(--shadow);
  z-index: 300;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
}

.toast.show { transform: translateY(0); opacity: 1; }

/* Pages */
.page { display: none; animation: fadeIn 0.3s ease; height: 100%; }
.page.active { display: flex; flex-direction: column; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
</style>
</head>

function loadData() {

  if (saved) {

  }
  // Ensure currentMonth is a Date
  if (typeof appState.currentMonth === 'string') appState.currentMonth = new Date(appState.currentMonth);
  if (!appState.activeWsId) appState.activeWsId = appState.workspaces[0].id;
  if (!appState.activePage) appState.activePage = 'dashboard';
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

  const totalProjects = data.projects.length;
  const editingCount = data.projects.filter(p => p.stage === 'editing' || p.stage === 'shooting').length;

  ];

  document.getElementById('statsGrid').innerHTML = stats.map(s => `
    <div class="stat-card" data-color="${s.color}">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-label-en">${s.labelEn}</div>
    </div>
  `).join('');

  const activities = [];

  data.materials.slice().reverse().slice(0, 3).forEach(m => {
    activities.push({ dot: 'var(--purple)', text: `素材：${m.title}（${m.port}）` });

      </div>
      <div class="content-body"><div class="kanban-board" id="kanbanBoard"></div></div>
    </div>
  `;
}

const stages = [
  { key: 'idea', label: '构思', labelEn: 'Idea', color: '#94a3b8' },
  { key: 'shooting', label: '拍摄中', labelEn: 'Shooting', color: '#fbbf24' },
  { key: 'editing', label: '剪辑中', labelEn: 'Editing', color: '#a78bfa' },
  { key: 'pending', label: '待发布', labelEn: 'Pending', color: '#00d4ff' },
  { key: 'published', label: '已发布', labelEn: 'Published', color: '#4ade80' },
];

function renderKanban() {
  const data = getActiveData();
  const board = document.getElementById('kanbanBoard');
  board.innerHTML = stages.map(stage => {
    const items = data.projects.filter(p => p.stage === stage.key);
    return `
      <div class="kanban-column">
        <div class="kanban-column-header">
          <div class="kanban-column-title">
            <span style="width:7px;height:7px;border-radius:50%;background:${stage.color};display:inline-block"></span>
            ${stage.label}<span class="en">${stage.labelEn}</span>
          </div>
          <span class="column-badge">${items.length}</span>
        </div>
        <div class="kanban-column-body" data-stage="${stage.key}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${stage.key}')">
          ${items.length ? items.map(p => `
            <div class="project-card" draggable="true" ondragstart="onDragStart(event,'${p.id}')" ondragend="onDragEnd(event)">
              <div class="project-card-title">${p.title}</div>
              ${p.titleEn ? `<div style="font-size:10px;color:var(--text-muted);margin-bottom:3px">${p.titleEn}</div>` : ''}
              <div class="project-card-meta">
                <span class="tag tag-port">⚓ ${p.port}</span>
                ${p.platform ? `<span class="tag tag-date">📡 ${p.platform}</span>` : ''}
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%;background:${stage.color}"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--text-muted)">
                <span>进度 ${p.progress}%</span><span>📅 ${p.deadline || ''}</span>
              </div>
              ${p.note ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:5px;line-height:1.3">${p.note}</div>` : ''}
              <div class="card-actions">
                <button class="btn btn-secondary btn-sm" onclick="openProjectModal('${p.id}')">编辑</button>
                <button class="btn btn-danger btn-sm" onclick="deleteProject('${p.id}')">删除</button>
              </div>
            </div>
          `).join('') : '<div class="empty-column">拖拽项目到这里</div>'}
        </div>
      </div>
    `;
  }).join('');
}

function onDragStart(e, id) { dragData = id; e.target.classList.add('dragging'); }
function onDragEnd(e) { e.target.classList.remove('dragging'); }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragData) {
    const data = getActiveData();
    const project = data.projects.find(p => p.id === dragData);
    if (project && project.stage !== stage) {
      project.stage = stage;
      if (stage === 'published') project.progress = 100;
      else if (stage === 'idea') project.progress = Math.min(project.progress, 10);
      saveData(); renderKanban(); showToast('✅ 状态已更新');
    }
  }
  dragData = null;
}

function renderMaterials() {
  const data = getActiveData();
  const portFilter = document.getElementById('filterPort');
  if (portFilter) {
    const currentVal = portFilter.value;
    const ports = [...new Set(data.materials.map(m => m.port))];
    portFilter.innerHTML = '<option value="">所有港口 All Ports</option>' + ports.map(p => `<option value="${p}">${p}</option>`).join('');
    portFilter.value = currentVal;
  }

  const search = document.getElementById('materialSearch')?.value.toLowerCase() || '';
  const fp = document.getElementById('filterPort')?.value || '';
  const fs = document.getElementById('filterStatus')?.value || '';
  const ft = document.getElementById('filterType')?.value || '';

  let filtered = data.materials.filter(m => {
    if (search && !m.title.toLowerCase().includes(search) && !m.port.toLowerCase().includes(search) && !(m.note||'').toLowerCase().includes(search)) return false;
    if (fp && m.port !== fp) return false;
    if (fs && m.status !== fs) return false;
    if (ft && m.type !== ft) return false;
    return true;
  });

  const typeMap = { video: '🎬', photo: '📷', audio: '🎵' };
  const statusMap = {
    raw: { cls: 'status-raw', text: '待整理 Raw' },
    sorted: { cls: 'status-sorted', text: '已分类 Sorted' },
    archived: { cls: 'status-archived', text: '已入库 Archived' }
  };

  const body = document.getElementById('materialsBody');
  if (!body) return;

  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无素材 · No footage found</div></div></td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(m => `
    <tr>
      <td><span class="type-icon">${typeMap[m.type] || '📎'}</span></td>
      <td>${m.title}</td>
      <td><span class="tag tag-port">${m.port}</span></td>
      <td>${m.date}</td>
      <td>${m.duration || '-'}</td>
      <td><span class="status-badge ${statusMap[m.status].cls}">${statusMap[m.status].text}</span></td>
      <td style="color:var(--text-secondary);max-width:180px;overflow:hidden;text-overflow:ellipsis">${m.note || '-'}</td>
      <td><div class="row-actions">
        <button class="icon-btn" onclick="openMaterialModal('${m.id}')" title="编辑">✏️</button>
        <button class="icon-btn delete" onclick="deleteMaterial('${m.id}')" title="删除">🗑️</button>
      </div></td>
    </tr>
  `).join('');
}

function renderCalendar() {
  const data = getActiveData();
  const year = appState.currentMonth.getFullYear();
  const month = appState.currentMonth.getMonth();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const monthNamesEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  document.getElementById('calendarMonth').textContent = `${year}年 ${monthNames[month]} · ${monthNamesEn[month]}`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = getDateString(new Date());

  let html = '';
  const weekDays = ['日 Sun','一 Mon','二 Tue','三 Wed','四 Thu','五 Fri','六 Sat'];
  weekDays.forEach(d => html += `<div class="calendar-header">${d}</div>`);
  for (let i = 0; i < firstDay; i++) html += '<div class="calendar-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events = data.calendarEvents.filter(e => e.date === dateStr);
    html += `<div class="calendar-cell ${dateStr === todayStr ? 'today' : ''}">
      <div class="calendar-day">${d}</div>
      ${events.map(e => `<div class="calendar-event ${e.type}" onclick="deleteCalendarEvent('${e.id}')" title="点击删除">${e.title}</div>`).join('')}
    </div>`;
  }
  document.getElementById('calendarGrid').innerHTML = html;
}

function prevMonth() { appState.currentMonth.setMonth(appState.currentMonth.getMonth() - 1); renderCalendar(); }
function nextMonth() { appState.currentMonth.setMonth(appState.currentMonth.getMonth() + 1); renderCalendar(); }

// ========== Notes ==========
function renderNotesPage() {
  return `
    <div class="page active">
      <div class="content-header">
        <div>
          <h2>灵感速记 <span style="font-size:13px;color:var(--text-muted);font-weight:400">Ideas & Notes</span></h2>
          <div class="header-sub">随时记录创意 · Capture ideas instantly</div>
        </div>
      </div>
      <div class="content-body">
        <div class="note-input">
          <input type="text" id="noteInput" placeholder="写下你的灵感... Write your idea..." onkeypress="if(event.key==='Enter')addNote()">
          <button class="btn btn-primary" onclick="addNote()">+ 记录</button>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
      </div>
    </div>
  `;
}

function renderNotes() {
  const data = getActiveData();
  const grid = document.getElementById('notesGrid');
  if (data.notes.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💡</div><div>暂无灵感 · No ideas yet</div></div>';
    return;
  }
  const sorted = [...data.notes].sort((a,b) => b.ts - a.ts);
  grid.innerHTML = sorted.map(n => {
    const d = new Date(n.ts);
    return `<div class="note-card">
      <div class="note-text">${escapeHtml(n.text)}</div>
      <div class="note-meta">
        <span>📝 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>
        <button class="note-delete" onclick="deleteNote('${n.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;
  getActiveData().notes.push({ id: 'n' + Date.now(), text, ts: Date.now() });
  saveData(); input.value = ''; renderNotes(); showToast('✅ 灵感已记录');
}

function deleteNote(id) {
  const data = getActiveData();
  data.notes = data.notes.filter(n => n.id !== id);
  saveData(); renderNotes();
}

// ========== Add Workspace ==========
function addWorkspace() {
  const name = prompt('工作区名称 / Workspace name:', '新工作区');
  if (!name) return;
  const id = 'ws' + Date.now();
  appState.workspaces.push({
    id, icon: '📁', name, nameEn: name, color: 'accent',
    data: { projects: [], materials: [], ports: [], notes: [], calendarEvents: [] }
  });
  appState.activeWsId = id;
  appState.activePage = 'dashboard';
  saveData(); renderAll(); showToast('✅ 工作区已创建');
}

// ========== Import/Export ==========
function exportData() {
  const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vlog_workbench_${getDateString(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.workspaces) {
        appState = data;
        if (typeof appState.currentMonth === 'string') appState.currentMonth = new Date(appState.currentMonth);
        saveData(); renderAll(); showToast('✅ 导入成功');
      } else { showToast('⚠️ 格式不正确'); }
    } catch(err) { showToast('⚠️ 导入失败'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========== Utils ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
