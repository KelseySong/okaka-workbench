<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFՑ0CB">
<title>哦卡卡的工作台</title>
<style>
/* ========== Design System ========== */
:root {
  --pink-50: #FDF2F8;
  --pink-100: #FCE7F3;
  --pink-200: #FBCFE8;
  --pink-300: #F9A8D4;
  --pink-400: #F472B6;
  --pink-500: #EC4899;
  --pink-600: #DB2777;
  --pink-700: #BE185D;
  --bg-main: #FFF5F9;
  --bg-sidebar: #FFE4EF;
  --bg-card: #FFFFFF;
  --bg-input: #FDF2F8;
  --bg-hover: #FCE7F3;
  --bg-bubble-user: #FFFFFF;
  --bg-bubble-ai: #FCE7F3;
  --text-primary: #4A2C38;
  --text-secondary: #8B6B7A;
  --text-muted: #C4A8B5;
  --border: #F9D4E5;
  --border-strong: #F0B4D4;
  --shadow: 0 2px 12px rgba(236, 72, 153, 0.08);
  --shadow-lg: 0 4px 24px rgba(236, 72, 153, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --transition: 0.25s ease;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --pink-50: #2D1B2E;
  --pink-100: #3A2340;
  --pink-200: #4A2D52;
  --pink-300: #6B3D6E;
  --pink-400: #D070A8;
  --pink-500: #EC4899;
  --pink-600: #F472B6;
  --pink-700: #F9A8D4;
  --bg-main: #1A0E1E;
  --bg-sidebar: #241327;
  --bg-card: #2D1B2E;
  --bg-input: #3A2340;
  --bg-hover: #3A2340;
  --bg-bubble-user: #2D1B2E;
  --bg-bubble-ai: #3A2340;
  --text-primary: #F0D9E4;
  --text-secondary: #B89AA8;
  --text-muted: #7A5A6E;
  --border: #3A2340;
  --border-strong: #4A2D52;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 24px rgba(0, 0, 0, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ========== Loading Screen ========== */
#loadingScreen {
  position: fixed;
  inset: 0;
  background: var(--bg-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s, visibility 0.5s;
}

#loadingScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.loading-heart {
  width: 48px; height: 48px;
  position: relative;
  animation: heartBeat 1s ease-in-out infinite;
}

.loading-heart::before, .loading-heart::after {
  content: '';
  position: absolute;
  width: 24px; height: 36px;
  background: var(--pink-400);
  border-radius: 24px 24px 0 0;
  top: 0; left: 12px;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}

.loading-heart::after {
  left: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.15); }
  50% { transform: scale(0.95); }
  75% { transform: scale(1.1); }
}

.loading-text {
  margin-top: 20px;
  font-size: 14px;
  color: var(--pink-500);
  font-weight: 600;
  letter-spacing: 1px;
}

/* ========== Layout ========== */
.app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ========== Sidebar ========== */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, border-color 0.3s;
}

.sidebar-header {
  padding: calc(16px + var(--safe-top)) 18px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sidebar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--pink-600);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-title-icon { font-size: 20px; }

.theme-toggle {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}

.theme-toggle:hover { background: var(--pink-200); transform: scale(1.05); }

[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 10px;
  -webkit-overflow-scrolling: touch;
}

.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--pink-300); border-radius: 2px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all var(--transition);
  margin-bottom: 4px;
  font-size: 14px;
  font-weight: 500;
  position: relative;
}

.nav-item:hover { background: var(--bg-hover); color: var(--pink-600); }

.nav-item.active {
  background: var(--pink-200);
  color: var(--pink-700);
  font-weight: 600;
}

[data-theme="dark"] .nav-item.active {
  background: var(--pink-300);
  color: var(--pink-50);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 60%;
  background: var(--pink-500);
  border-radius: 0 3px 3px 0;
}

.nav-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }

.nav-badge {
  margin-left: auto;
  font-size: 10px;
  background: var(--pink-300);
  color: var(--pink-700);
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
}

[data-theme="dark"] .nav-badge { background: var(--pink-500); color: #fff; }

.sidebar-footer {
  padding: 12px 14px calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.clear-all-btn {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--pink-300);
  background: transparent;
  color: var(--pink-600);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.clear-all-btn:hover { background: var(--pink-100); }

/* ========== Main Content ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.main-header {
  padding: calc(14px + var(--safe-top)) 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  background: var(--bg-card);
}

.main-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

.main-header-icon { font-size: 22px; flex-shrink: 0; }

.main-header-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.main-header-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 1px;
}

.clear-chat-btn {
  padding: 7px 14px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--pink-600);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all var(--transition);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.clear-chat-btn:hover { background: var(--pink-100); }

/* ========== Chat Area ========== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 16px 8px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 3px; }

.message {
  max-width: 85%;
  margin-bottom: 16px;
  animation: msgIn 0.3s ease;
  position: relative;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-user {
  margin-left: auto;
}

.message-ai {
  margin-right: auto;
}

.bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
  position: relative;
}

.message-user .bubble {
  background: var(--bg-bubble-user);
  border: 1.5px solid var(--pink-300);
  color: var(--text-primary);
  border-bottom-right-radius: 4px;
}

.message-ai .bubble {
  background: var(--bg-bubble-ai);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
}

.bubble-content { white-space: pre-wrap; }

.bubble-content a {
  color: var(--pink-500);
  text-decoration: underline;
  word-break: break-all;
}

.bubble-content strong { color: var(--pink-700); font-weight: 700; }

[data-theme="dark"] .bubble-content strong { color: var(--pink-300); }

.bubble-content code {
  background: rgba(236, 72, 153, 0.1);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  font-family: "SF Mono", "Fira Code", monospace;
}

.bubble-content ul, .bubble-content ol {
  margin: 6px 0;
  padding-left: 20px;
}

.bubble-content li { margin: 3px 0; }

.bubble-content h1, .bubble-content h2, .bubble-content h3 {
  margin: 10px 0 6px;
  color: var(--pink-600);
  font-size: 15px;
  font-weight: 700;
}

/* Copy button */
.copy-btn {
  position: absolute;
  bottom: 4px; right: 8px;
  font-size: 11px;
  color: var(--pink-500);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  opacity: 0.7;
  transition: all 0.2s;
  font-weight: 600;
}

.copy-btn:hover { opacity: 1; background: rgba(236, 72, 153, 0.1); }

.message-user .copy-btn { display: none; }

/* Loading indicator */
.loading-bubble {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 16px 20px;
}

.loading-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--pink-400);
  animation: dotPulse 1.2s ease-in-out infinite;
}

.loading-dot:nth-child(2) { animation-delay: 0.15s; }
.loading-dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes dotPulse {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
  40% { transform: scale(1.1); opacity: 1; }
}

/* Welcome message */
.welcome-msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.welcome-icon { font-size: 48px; margin-bottom: 12px; }

.welcome-title { font-size: 16px; font-weight: 600; color: var(--pink-500); margin-bottom: 6px; }

.welcome-desc { font-size: 13px; line-height: 1.6; max-width: 320px; margin: 0 auto; }

.welcome-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

.suggestion-chip {
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  color: var(--pink-600);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
}

.suggestion-chip:hover { background: var(--pink-100); transform: translateY(-1px); }

/* ========== Input Area ========== */
.input-area {
  padding: 10px 16px calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg-card);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.input-wrapper {
  flex: 1;
  position: relative;
}

#msgInput {
  width: 100%;
  min-height: 42px;
  max-height: 120px;
  padding: 11px 16px;
  border-radius: 21px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  transition: border-color var(--transition);
  line-height: 1.5;
}

#msgInput:focus { border-color: var(--pink-400); }

#msgInput::placeholder { color: var(--text-muted); }

.send-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
  color: #fff;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}

.send-btn:hover:not(:disabled) {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
}

.send-btn:disabled, .send-btn.disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}

.send-icon-send { display: inline; }
.send-icon-stop { display: none; }
.send-btn.generating .send-icon-send { display: none; }
.send-btn.generating .send-icon-stop { display: inline; }

/* ========== Todo Section ========== */
.todo-container {
  padding: 16px;
  max-width: 640px;
  margin: 0 auto;
}

.todo-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.todo-input-row input {
  flex: 1;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.todo-input-row input:focus { border-color: var(--pink-400); }

.todo-add-btn {
  padding: 0 18px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all var(--transition);
  white-space: nowrap;
}

.todo-add-btn:hover { transform: scale(1.02); }

.todo-list { list-style: none; }

.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: all var(--transition);
  animation: msgIn 0.3s ease;
}

.todo-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }

.todo-checkbox {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border-strong);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  background: var(--bg-card);
}

.todo-checkbox.checked {
  background: var(--pink-500);
  border-color: var(--pink-500);
}

.todo-checkbox.checked::after {
  content: '✓';
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}

.todo-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.todo-delete {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.todo-delete:hover { color: var(--pink-500); background: var(--pink-100); }

.todo-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.todo-empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }

.todo-filters {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.todo-filter {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all var(--transition);
}

.todo-filter.active { background: var(--pink-200); color: var(--pink-700); border-color: var(--pink-300); }
[data-theme="dark"] .todo-filter.active { background: var(--pink-500); color: #fff; }

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(74, 44, 56, 0.5);
  backdrop-filter: blur(4px);
  z-index: 5000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.active { display: flex; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 360px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.3s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-icon { font-size: 32px; text-align: center; margin-bottom: 12px; }

.modal-title {
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.modal-desc {
  font-size: 13px;
  text-align: center;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.5;
}

.modal-buttons { display: flex; gap: 10px; }

.modal-btn {
  flex: 1;
  padding: 11px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all var(--transition);
}

.modal-btn-cancel {
  background: var(--bg-card);
  color: var(--pink-500);
  border: 1.5px solid var(--pink-300);
}

.modal-btn-cancel:hover { background: var(--pink-100); }

.modal-btn-confirm {
  background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
  color: #fff;
}

.modal-btn-confirm:hover { transform: scale(1.02); }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--pink-500);
  color: #fff;
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 6000;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ========== Mobile Sidebar Toggle ========== */
.menu-toggle {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--pink-600);
  width: 36px; height: 36px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 18px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 999;
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.3s;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.active { display: block; }
  .menu-toggle { display: flex; }
  .message { max-width: 92%; }
}

/* Error message */
.error-bubble {

/* ========== State ========== */
let activeSectionId = 'video';
let chatHistories = {};  // { sectionId: [{role, content}] }
let todoItems = [];      // work section todos
let isGenerating = false;
let abortController = null;

/* ========== Storage ========== */
const STORAGE_KEY = 'okaka_workbench_v1';
const THEME_KEY = 'okaka_theme';

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      chatHistories = data.chatHistories || {};
      todoItems = data.todoItems || [];
      activeSectionId = data.activeSectionId || 'video';
    }
  } catch(e) { console.error('Load failed:', e); }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chatHistories,
      todoItems,
      activeSectionId
    }));
  } catch(e) { console.error('Save failed:', e); }
}

function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  if (current === 'dark') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(THEME_KEY, 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem(THEME_KEY, 'dark');
  }
}

/* ========== Render Sidebar ========== */
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = SECTIONS.map(s => {
    let badge = '';
    if (s.type === 'chat' && chatHistories[s.id]) {
      const count = chatHistories[s.id].length;
      if (count > 0) badge = `<span class="nav-badge">${count}</span>`;
    } else if (s.id === 'work' && todoItems.length > 0) {
      const undone = todoItems.filter(t => !t.done).length;
      if (undone > 0) badge = `<span class="nav-badge">${undone}</span>`;
    }
    return `
      <div class="nav-item ${s.id === activeSectionId ? 'active' : ''}" onclick="switchSection('${s.id}')">
        <span class="nav-icon">${s.icon}</span>
        <span>${s.name}</span>
        ${badge}
      </div>
    `;
  }).join('');
}

function switchSection(id) {
  activeSectionId = id;
  saveData();
  renderSidebar();
  renderMain();
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

/* ========== Render Main ========== */
function renderMain() {
  const section = SECTIONS.find(s => s.id === activeSectionId);
  if (!section) return;

  // Header
  document.getElementById('headerIcon').textContent = section.icon;
  document.getElementById('headerTitle').textContent = section.name;
  document.getElementById('headerSub').textContent = section.nameEn;

  // Clear button visibility
  const clearBtn = document.getElementById('clearChatBtn');
  const inputArea = document.getElementById('inputArea');

  if (section.type === 'todo') {
    clearBtn.style.display = 'none';
    inputArea.style.display = 'none';
    renderTodo();
  } else {
    clearBtn.style.display = 'flex';
    inputArea.style.display = 'block';

}

/* ========== Chat Rendering ========== */
function renderChat() {
  const section = SECTIONS.find(s => s.id === activeSectionId);
  const history = chatHistories[section.id] || [];
  const area = document.getElementById('chatArea');

  if (history.length === 0) {
    area.innerHTML = `
      <div class="welcome-msg">
        <div class="welcome-icon">${section.icon}</div>
        <div class="welcome-title">${section.welcome}</div>
        <div class="welcome-desc">${section.desc}</div>
        ${section.suggestions && section.suggestions.length ? `
          <div class="welcome-suggestions">
            ${section.suggestions.map(s => `<div class="suggestion-chip" onclick="useSuggestion('${s.replace(/'/g, "\\'")}')">${s}</div>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
    return;
  }

  area.innerHTML = history.map(msg => renderMessage(msg)).join('');
  // If last message is generating placeholder, show loading
  const last = history[history.length - 1];
  if (last && last.role === 'ai' && last.loading) {
    area.innerHTML += `
      <div class="message message-ai">
        <div class="bubble loading-bubble">
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        </div>
      </div>
    `;
  }
  scrollToBottom();
}

function renderMessage(msg) {
  if (msg.role === 'user') {
    return `
      <div class="message message-user">
        <div class="bubble">
          <div class="bubble-content">${escapeHtml(msg.content)}</div>
          <button class="copy-btn" onclick="copyMessage(this, ${JSON.stringify(msg.content).replace(/"/g, '&quot;')})">复制</button>
        </div>
      </div>
    `;
  } else {
    const html = formatAIContent(msg.content);
    const isError = msg.error ? ' error-bubble' : '';
    return `
      <div class="message message-ai">
        <div class="bubble${isError}">
          <div class="bubble-content">${html}</div>
          ${!msg.error ? `<button class="copy-btn" onclick="copyMessage(this, ${JSON.stringify(msg.content).replace(/"/g, '&quot;')})">复制</button>` : ''}
        </div>
      </div>
    `;
  }
}

function formatAIContent(text) {
  let html = escapeHtml(text);
  // Bold **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Inline code `code`
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  // Headers ### text
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Lists - lines starting with - or * or number.
  html = html.replace(/^[\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^[*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+[\.)] (.+)$/gm, '<li>$1</li>');
  // Wrap consecutive <li> in <ul>
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  html = html.replace(/<\/li>\n(<li>)/g, '</li><li>');
  // Links - auto detect URLs
  html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Line breaks (but not inside HTML elements)
  html = html.replace(/\n/g, '<br>');
  // Fix: remove extra <br> around block elements
  html = html.replace(/<br>(<(h[1-3]|ul|ol|li))/g, '$1');
  html = html.replace(/(<\/(h[1-3]|ul|ol|li)>)<br>/g, '$1');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  const area = document.getElementById('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

function useSuggestion(text) {
  const input = document.getElementById('msgInput');
  input.value = text;
  updateSendBtn();
  input.focus();
  // Auto-resize
  autoResize(input);
}

/* ========== Send Message ========== */
async function sendMessage() {
  if (isGenerating) {
    // Stop generation
    if (abortController) abortController.abort();
    return;
  }

  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const section = SECTIONS.find(s => s.id === activeSectionId);
  if (section.type !== 'chat') return;

  // Add user message
  if (!chatHistories[section.id]) chatHistories[section.id] = [];
  chatHistories[section.id].push({ role: 'user', content: text });

  // Add AI loading placeholder
  chatHistories[section.id].push({ role: 'ai', content: '', loading: true });

  // Clear input
  input.value = '';
  autoResize(input);
  updateSendBtn();

  // Render
  renderChat();
  renderSidebar();
  saveData();

  // Set generating state
  isGenerating = true;
  updateGenerateBtn();

  // Prepare messages for API
  const history = chatHistories[section.id]
    .filter(m => !m.loading && !m.error)
    .map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }));

  const messages = [
    { role: 'system', content: section.systemPrompt },
    ...history.slice(0, -1)  // exclude the last user message we just added
  ];
  // Actually we need to include all messages including the latest user message
  messages.push(...history);

  // Call AI API
  abortController = new AbortController();

  try {
    const response = await callAI(messages, abortController.signal);
    
    // Update the loading placeholder
    const aiMessages = chatHistories[section.id];
    aiMessages[aiMessages.length - 1] = { role: 'ai', content: response };
    
  } catch(err) {
    if (err.name === 'AbortError') {
      // User stopped generation
      const aiMessages = chatHistories[section.id];
      const last = aiMessages[aiMessages.length - 1];
      if (last.loading) {
        aiMessages[aiMessages.length - 1] = { role: 'ai', content: '（已停止生成）', error: false };
      }
    } else {
      // Error
      const aiMessages = chatHistories[section.id];
      aiMessages[aiMessages.length - 1] = { role: 'ai', content: '抱歉，发生错误：' + err.message + '\n\n请稍后重试。', error: true };
    }
  }

  isGenerating = false;
  abortController = null;
  updateGenerateBtn();
  renderChat();
  renderSidebar();
  saveData();
}

async function callAI(messages, signal) {
  // Use relative path - works on any deployment
  const API_ENDPOINT = window.location.origin + '/api/chat';

  const response = await fetch(API_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: signal,
    body: JSON.stringify({ messages })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error || `请求失败 (${response.status})`);
  }

  const data = await response.json();
  return data.content || '无回复内容';
}

function updateGenerateBtn() {
  const btn = document.getElementById('sendBtn');
  if (isGenerating) {
    btn.classList.add('generating');
  } else {
    btn.classList.remove('generating');
  }
}

/* ========== Input Handling ========== */
function updateSendBtn() {
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  
  if (isGenerating) {
    btn.disabled = false;
    btn.classList.remove('disabled');
  } else if (text) {
    btn.disabled = false;
    btn.classList.remove('disabled');
  } else {
    btn.disabled = true;
    btn.classList.add('disabled');
  }
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

document.getElementById('msgInput').addEventListener('input', function() {
  updateSendBtn();
  autoResize(this);
});

document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* ========== Copy ========== */
function copyMessage(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('复制成功');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '复制'; }, 1500);
  }).catch(() => {
    // Fallback
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); showToast('复制成功'); } catch(e) { showToast('复制失败'); }
    document.body.removeChild(textarea);
  });
}

/* ========== Clear Chat ========== */
function confirmClearChat() {
  const section = SECTIONS.find(s => s.id === activeSectionId);
  showModal('🗑️', `清空「${section.name}」对话`, '确定要清空当前板块的所有聊天记录吗？此操作不可撤销。', () => {
    chatHistories[section.id] = [];
    saveData();
    renderChat();
    renderSidebar();
    showToast('已清空当前对话');
  });
}

function confirmClearAll() {
  showModal('🗑️', '清空全部对话', '确定要清空所有板块的全部聊天记录和待办事项吗？此操作不可撤销。', () => {
    chatHistories = {};
    todoItems = [];
    saveData();
    renderMain();
    renderSidebar();
    showToast('已清空全部数据');
  });
}

/* ========== Modal ========== */
function showModal(icon, title, desc, onConfirm) {
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-icon">${icon}</div>
    <div class="modal-title">${title}</div>
    <div class="modal-desc">${desc}</div>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
      <button class="modal-btn modal-btn-confirm" id="modalConfirm">确定</button>
    </div>
  `;
  overlay.classList.add('active');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalConfirm').onclick = () => { closeModal(); onConfirm(); };
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

/* ========== Toast ========== */
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ========== Todo Section ========== */
let todoFilter = 'all';

function renderTodo() {
  const area = document.getElementById('chatArea');
  let filtered = todoItems;
  if (todoFilter === 'active') filtered = todoItems.filter(t => !t.done);
  if (todoFilter === 'done') filtered = todoItems.filter(t => t.done);

  area.innerHTML = `
    <div class="todo-container">
      <div class="todo-input-row">
        <input type="text" id="todoInput" placeholder="输入待办事项，按回车添加..." onkeydown="if(event.key==='Enter')addTodo()">
        <button class="todo-add-btn" onclick="addTodo()">添加</button>
      </div>
      <div class="todo-filters">
        <div class="todo-filter ${todoFilter==='all'?'active':''}" onclick="setTodoFilter('all')">全部 (${todoItems.length})</div>
        <div class="todo-filter ${todoFilter==='active'?'active':''}" onclick="setTodoFilter('active')">待办 (${todoItems.filter(t=>!t.done).length})</div>
        <div class="todo-filter ${todoFilter==='done'?'active':''}" onclick="setTodoFilter('done')">已完成 (${todoItems.filter(t=>t.done).length})</div>
      </div>
      <ul class="todo-list">
        ${filtered.length === 0 ? `
          <div class="todo-empty">
            <div class="todo-empty-icon">📝</div>
            <div>${todoItems.length === 0 ? '还没有待办事项，添加一个吧！' : '没有符合条件的待办'}</div>
          </div>
        ` : filtered.map(t => `
          <li class="todo-item ${t.done ? 'done' : ''}">
            <div class="todo-checkbox ${t.done ? 'checked' : ''}" onclick="toggleTodo('${t.id}')"></div>
            <div class="todo-text">${escapeHtml(t.text)}</div>
            <button class="todo-delete" onclick="deleteTodo('${t.id}')">🗑️</button>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function addTodo() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) return;
  todoItems.unshift({ id: 't' + Date.now(), text, done: false });
  saveData();
  renderTodo();
  renderSidebar();
  input.focus();
}

function toggleTodo(id) {
  const t = todoItems.find(t => t.id === id);
  if (t) { t.done = !t.done; saveData(); renderTodo(); renderSidebar(); }
}

function deleteTodo(id) {
  todoItems = todoItems.filter(t => t.id !== id);
  saveData();
  renderTodo();
  renderSidebar();
}

function setTodoFilter(f) {
  todoFilter = f;
  renderTodo();
}

/* ========== Mobile Sidebar ========== */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('active');
}

/* ========== Init ========== */
loadTheme();
loadData();
renderSidebar();
renderMain();

// Hide loading screen
setTimeout(() => {
  document.getElementById('loadingScreen').classList.add('hidden');
}, 800);
</script>
