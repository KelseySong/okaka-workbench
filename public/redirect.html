<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中...</title>
<style>
body{margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#FFF5F9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.box{text-align:center;padding:40px 20px}
.spinner{width:40px;height:40px;border:4px solid #FCE7F3;border-top-color:#EC4899;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.txt{color:#8B6B7A;font-size:15px;margin-bottom:8px}
.link{color:#EC4899;font-size:14px;word-break:break-all;max-width:90vw;margin-top:12px;padding:8px 16px;background:#fff;border-radius:8px;display:inline-block}
.btn{margin-top:20px;padding:10px 28px;background:#EC4899;color:#fff;border:none;border-radius:20px;font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="box">
<div class="spinner"></div>
<div class="txt">正在跳转到外部应用...</div>
<a id="link" class="link" href="#">点击这里如果没有自动跳转</a>
<br>
<button class="btn" onclick="go()">立即跳转</button>
</div>
<script>
function getParam(name){
  var m=new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1]):'';
}
function go(){
  var target=getParam('u');
  if(target){
    window.location.replace(target);
  }
}
// Auto redirect after short delay
setTimeout(go,300);
// Also set the link for manual click
document.getElementById('link').href=getParam('u')||'#';
document.getElementById('link').textContent=getParam('u')?'点这里打开：'+getParam('u'):'';
</script>
</body>
</html>
